name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generator runs end to end
        run: python src/generate_data.py --out /tmp/regenerated
      - name: Data-quality tests
        run: pytest -q
